<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Packeta választó</title>
  <script>
const button = document.getElementById("packetaBtn");

button.addEventListener("click", function () {

  Packeta.Widget.pick(
    "8f7f8c3c9e",

    function(point) {

      if (!point || !point.name) {
        alert("Nincs kiválasztott csomagpont!");
        return;
      }

      const name = String(point.name).trim();

      const tallyUrl =
        "https://tally.so/r/rj2lKM"
        + "?packeta_name=" + encodeURIComponent(name);

      setTimeout(function () {
        window.location.href = tallyUrl;
      }, 300);

    }

  );

});
</script>

</body>
</html>
